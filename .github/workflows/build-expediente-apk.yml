name: Build Expediente Inteligente APK
on:
  push:
    branches: [build-expediente-inteligente-apk]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack Android project
        run: unzip -q expediente-src.zip
      - name: Build debug APK
        working-directory: ExpedienteInteligente
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ExpedienteInteligente-APK
          path: ExpedienteInteligente/app/build/outputs/apk/debug/app-debug.apk

name: Build Expediente Inteligente APK
on:
  pull_request:
    branches: [build-expediente-inteligente-apk]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate and unpack v1.2 source
        run: |
          test "$(stat -c%s v12-src.zip)" = "28567"
          unzip -t v12-src.zip
          unzip -q v12-src.zip
      - name: Build debug APK
        working-directory: mnt/data/expv12/ExpedienteInteligente
        run: gradle --no-daemon assembleDebug
      - name: Validate APK
        run: |
          APK="mnt/data/expv12/ExpedienteInteligente/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK"
          sha256sum "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ExpedienteInteligente-v1.2-Facturas-APK
          path: mnt/data/expv12/ExpedienteInteligente/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

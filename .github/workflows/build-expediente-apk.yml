name: Build Expediente Inteligente APK
on:
  push:
    branches: [build-expediente-inteligente-apk]
  pull_request:
    branches: [build-expediente-inteligente-apk]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Reassemble and validate base project
        run: |
          cat apk_parts/part_00 apk_parts/part_01 apk_parts/part_02 apk_parts/part_03 > expediente-src.zip
          test "$(stat -c%s expediente-src.zip)" = "19997"
          unzip -t expediente-src.zip
          unzip -q expediente-src.zip
      - name: Restore exact v1.2 invoice sources
        run: |
          base64 -d v13_overlay/MainActivity.java.gz.b64 | gzip -d > ExpedienteInteligente/app/src/main/java/com/syncro/expediente/MainActivity.java
          base64 -d v13_overlay/InvoiceParser.java.gz.b64 | gzip -d > ExpedienteInteligente/app/src/main/java/com/syncro/expediente/InvoiceParser.java
          base64 -d v13_overlay/Database.java.gz.b64 | gzip -d > ExpedienteInteligente/app/src/main/java/com/syncro/expediente/Database.java
          grep -q 'findDuplicateInvoice' ExpedienteInteligente/app/src/main/java/com/syncro/expediente/Database.java
          grep -q 'InvoiceFieldRefiner.enrich' ExpedienteInteligente/app/src/main/java/com/syncro/expediente/MainActivity.java
      - name: Apply v1.3 PDF intelligence overlay
        run: |
          cp v13_overlay/PdfHybridExtractor.java ExpedienteInteligente/app/src/main/java/com/syncro/expediente/PdfHybridExtractor.java
          cp v13_overlay/InvoiceFieldRefiner.java ExpedienteInteligente/app/src/main/java/com/syncro/expediente/InvoiceFieldRefiner.java
          python3 - <<'PY'
          from pathlib import Path
          b=Path('ExpedienteInteligente/app/build.gradle')
          s=b.read_text()
          s=s.replace("versionCode 3", "versionCode 4").replace("versionName '1.2.0'", "versionName '1.3.0'")
          if "pdfbox-android" not in s:
              s=s.replace("implementation 'com.google.mlkit:text-recognition:16.0.1'", "implementation 'com.google.mlkit:text-recognition:16.0.1'\n    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'")
          b.write_text(s)
          PY
      - name: Normalize Kotlin dependencies
        run: |
          printf '%s\n' '' 'configurations.configureEach {' "    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'" "    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'" '}' >> ExpedienteInteligente/app/build.gradle
      - name: Build debug APK
        working-directory: ExpedienteInteligente
        run: gradle --no-daemon assembleDebug
      - name: Validate APK
        run: |
          test -s ExpedienteInteligente/app/build/outputs/apk/debug/app-debug.apk
          file ExpedienteInteligente/app/build/outputs/apk/debug/app-debug.apk
          sha256sum ExpedienteInteligente/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ExpedienteInteligente-v1.3-PDF-Inteligente-APK
          path: ExpedienteInteligente/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

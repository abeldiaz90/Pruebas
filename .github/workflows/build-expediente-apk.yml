name: Build Expediente Inteligente APK
on:
  pull_request:
    branches: [build-expediente-inteligente-apk]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Reassemble base project
        run: |
          cat apk_parts/part_00 apk_parts/part_01 apk_parts/part_02 apk_parts/part_03 > expediente-src.zip
          test "$(stat -c%s expediente-src.zip)" = "19997"
          unzip -t expediente-src.zip
          unzip -q expediente-src.zip
      - name: Overlay invoice v1.1 sources
        run: |
          cp invoice_v11/app/build.gradle ExpedienteInteligente/app/build.gradle
          cp invoice_v11/app/src/main/java/com/syncro/expediente/Database.java ExpedienteInteligente/app/src/main/java/com/syncro/expediente/Database.java
          cp invoice_v11/app/src/main/java/com/syncro/expediente/InvoiceParser.java ExpedienteInteligente/app/src/main/java/com/syncro/expediente/InvoiceParser.java
          cp invoice_v11/app/src/main/java/com/syncro/expediente/MainActivity.java ExpedienteInteligente/app/src/main/java/com/syncro/expediente/MainActivity.java
      - name: Build debug APK
        working-directory: ExpedienteInteligente
        run: gradle --no-daemon assembleDebug
      - name: Validate APK
        run: |
          test -s ExpedienteInteligente/app/build/outputs/apk/debug/app-debug.apk
          file ExpedienteInteligente/app/build/outputs/apk/debug/app-debug.apk
          sha256sum ExpedienteInteligente/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ExpedienteInteligente-v1.1-Facturas-APK
          path: ExpedienteInteligente/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

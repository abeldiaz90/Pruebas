name: Build ConsultaMX v2.1 RPA Temp

on:
  pull_request:
    branches: [master]
    paths:
      - 'ConsultaMX/**'
      - '.github/workflows/consultamx-v210-temp.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle -p ConsultaMX assembleDebug --stacktrace
      - name: Prepare APK
        run: cp ConsultaMX/app/build/outputs/apk/debug/app-debug.apk ConsultaMX-v2.1.0-RPA.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ConsultaMX-v2.1.0-RPA
          path: ConsultaMX-v2.1.0-RPA.apk
          if-no-files-found: error

name: Build ConsultaMX APK

on:
  push:
    branches: [consultamx-build-20260822]
    paths:
      - 'ConsultaMX/**'
      - '.github/workflows/consultamx-build.yml'
  pull_request:
    branches: [master]
    paths:
      - 'ConsultaMX/**'
      - '.github/workflows/consultamx-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle -p ConsultaMX assembleDebug --stacktrace
      - name: Prepare artifact
        run: cp ConsultaMX/app/build/outputs/apk/debug/app-debug.apk ConsultaMX-EsFraude-v1.0.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ConsultaMX-EsFraude-v1.0.0
          path: ConsultaMX-EsFraude-v1.0.0.apk
          if-no-files-found: error

name: Build INE Scanner APK

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    if: contains(github.head_ref, 'ine-ocr-apk') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ine-scanner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble v0.5 source
        run: |
          cat v04-src/part*.txt > app/src/main/java/com/syncro/inescanner/MainActivity.java
          python3 v05-patch.py
          sed -i "s/versionCode 3/versionCode 5/" app/build.gradle
          sed -i "s/versionName '0.3.0'/versionName '0.5.0'/" app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK v0.5
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: INE-Scanner-v0.5-debug
          path: ine-scanner/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
